name: Go Test

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - .github/workflows/main.yaml
      - .github/workflows/gen_coverage.yaml
      - assets
      - Makefile
  pull_request:
    types: 
      - opened
      - reopened
      - review_requested
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - .github/workflows/main.yaml
      - .github/workflows/gen_coverage.yaml
      - assets
      - Makefile
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Vet
      run: go vet ./...

    - name: Check code style
      run: test -z "$(gofmt -l -s .)" || (gofmt -l -s . && exit 1)

    # The runner has a Docker daemon, so the docker package's integration
    # tests run too (they pull busybox).
    - name: Run tests
      env:
        DOCKEROLLER_DOCKER_TESTS: "1"
      run: go test -race -coverprofile=coverage.txt -covermode=atomic ./...
